name: Release app

# Push a tag like  pomodoro-v1.0.0  (tools/ship.py does this for you).
on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write
  actions: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.parse.outputs.slug }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "slug=${TAG%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*-v}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      SLUG: ${{ needs.meta.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          if [ -f "apps/${SLUG}/requirements.txt" ]; then pip install -r "apps/${SLUG}/requirements.txt"; fi
      - name: "Build (Windows and Linux: single file)"
        if: runner.os != 'macOS'
        shell: bash
        run: |
          WINDOWED=""
          if [ "$RUNNER_OS" = "Windows" ]; then WINDOWED="--windowed"; fi
          pyinstaller --onefile $WINDOWED --name "${SLUG}-${RUNNER_OS}" "apps/${SLUG}/main.py"
      - name: "Build (macOS: .app bundle, zipped)"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --windowed --name "${SLUG}-${RUNNER_OS}" "apps/${SLUG}/main.py"
          cd dist
          ditto -c -k --keepParent "${SLUG}-${RUNNER_OS}.app" "${SLUG}-${RUNNER_OS}.zip"
          mkdir ../out && mv "${SLUG}-${RUNNER_OS}.zip" ../out/
      - name: Collect output
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" != "macOS" ]; then cp dist/* out/; fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: out/*

  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: build-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.meta.outputs.slug }} v${{ needs.meta.outputs.version }}
          files: dist/*
          generate_release_notes: true
      - name: Redeploy the storefront now that the downloads exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
